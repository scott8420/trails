<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Trails app icon (s015): a round glass orb with the hound's paw. -->
  <defs>
    <!-- body: Trails' warm-to-violet sweep -->
    <linearGradient id="body" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.5" stop-color="#e8366f"/>
      <stop offset="1" stop-color="#6d35d8"/>
    </linearGradient>
    <!-- depth: darker toward the rim, as glass thickens -->
    <radialGradient id="depth" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0638" stop-opacity="0.45"/>
    </radialGradient>
    <!-- light caught in the bottom of the glass -->
    <radialGradient id="glow" cx="0.5" cy="0.92" r="0.45">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <!-- the window reflection across the top -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f2"/>
    </linearGradient>
    <clipPath id="orb"><circle cx="64" cy="62" r="54"/></clipPath>
  </defs>

  <!-- soft shadow under the orb -->
  <ellipse cx="64" cy="118" rx="40" ry="7" fill="url(#drop)"/>

  <circle cx="64" cy="62" r="54" fill="url(#body)"/>
  <circle cx="64" cy="62" r="54" fill="url(#depth)"/>
  <circle cx="64" cy="62" r="54" fill="url(#glow)"/>

  <!-- the paw, with a faint shadow so it sits inside the glass -->
  <g transform="translate(64 66)">
    <g fill="#3b0a4f" opacity="0.28" transform="translate(1.5 3)">
      <path d="M0 4c-9 0-17 7-17 14 0 5 4 7 8 7 4 0 6-2 9-2s5 2 9 2c4 0 8-2 8-7 0-7-8-14-17-14z"/>
      <ellipse cx="-20" cy="-6" rx="6.5" ry="8.5" transform="rotate(-20 -20 -6)"/>
      <ellipse cx="-8" cy="-18" rx="6.5" ry="9"/>
      <ellipse cx="8" cy="-18" rx="6.5" ry="9"/>
      <ellipse cx="20" cy="-6" rx="6.5" ry="8.5" transform="rotate(20 20 -6)"/>
    </g>
    <g fill="url(#paw)">
      <path d="M0 4c-9 0-17 7-17 14 0 5 4 7 8 7 4 0 6-2 9-2s5 2 9 2c4 0 8-2 8-7 0-7-8-14-17-14z"/>
      <ellipse cx="-20" cy="-6" rx="6.5" ry="8.5" transform="rotate(-20 -20 -6)"/>
      <ellipse cx="-8" cy="-18" rx="6.5" ry="9"/>
      <ellipse cx="8" cy="-18" rx="6.5" ry="9"/>
      <ellipse cx="20" cy="-6" rx="6.5" ry="8.5" transform="rotate(20 20 -6)"/>
    </g>
  </g>

  <!-- gloss: the top reflection, clipped to the orb -->
  <g clip-path="url(#orb)">
    <ellipse cx="64" cy="30" rx="42" ry="24" fill="url(#gloss)" opacity="0.55"/>
  </g>
  <ellipse cx="44" cy="26" rx="9" ry="4.5" fill="#fff" opacity="0.7" transform="rotate(-28 44 26)"/>

  <!-- rim -->
  <circle cx="64" cy="62" r="53" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
